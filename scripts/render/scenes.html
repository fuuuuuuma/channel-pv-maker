<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- PV の場面（ブラウザで 1 コマずつ描いて書き出す）。中身は案件の build/scenes.json、長さは build/timeline.json の fx ブロック。
     場面の種類（type）: title / brand / stat / map / list / wall / quotes / xwall / chapter / brand_end
                        card / photo / credits / countdown（文字カード・写真 1 枚＋年・エンドロール・カウントダウン）
                        glow / leak / page / stack（金の光の粒と 1 語ずつの文字・光漏れ・エンドロールの 1 組・写真が重なっていく）
     どの場面でも "back": {img, blur, op, sat, tint} で地を止めて敷ける（cam の寄りや場面の溶けに動かされない。同じ地の場面を切りでつなぐと地が止まって見える）
     "overlay": true の場面は地が透明（映像の上に重ねる）。"hole": [x, y, 幅, 高さ] はその四角だけ地を抜く（映像の窓・額）。
     画像の道は案件フォルダからの相対（例 assets/brand/logo.png）。 -->
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800;900&family=Noto+Serif+JP:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
@font-face{font-family:IN;src:url(fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:IN;src:url(fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:IN;src:url(fonts/Inter-900.ttf);font-weight:900}
@font-face{font-family:DG;src:url(fonts/DelaGothicOne-Regular.ttf)}
@font-face{font-family:JPL;src:local('HiraginoSans-W3');font-weight:300}
@font-face{font-family:JPL;src:local('HiraginoSans-W6');font-weight:600}
@font-face{font-family:JPL;src:local('HiraginoSans-W8');font-weight:800}
@font-face{font-family:JPL;src:local('HiraginoSans-W9');font-weight:900}
@font-face{font-family:JPM;src:local('HiraMinProN-W3');font-weight:300 500}
@font-face{font-family:JPM;src:local('HiraMinProN-W6');font-weight:600 900}
/* 見た目の変数。scenes.json の theme で替える（fg 文字の色・fg2 控えめの文字・line 線・land 地図の陸・shade 文字の下の暗さ・font: 'serif' で明朝とセリフの英字） */
:root{--y:#ffd400;--o:#f07a12;--bg:#0b0b0c;--brand:#FFE73C;--dot:#f08a00;--fg:#fff;--fg2:rgba(255,255,255,.72);--line:rgba(255,255,255,.42);--land:rgba(255,255,255,.05);
  --shade:rgba(0,0,0,.55);--mat:#fff;--WS:800;--SANS:JPL,'Noto Sans JP',sans-serif;--SERIF:JPM,'Noto Serif JP',serif;--JP:var(--SANS);--EN:IN;--ENS:'Cormorant Garamond',serif;--SC:'Pinyon Script',cursive}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-variant-numeric:lining-nums}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#cam *{font-variant-numeric:lining-nums tabular-nums !important}   /* セリフの英字の数字を下に突き出ない形に（font の一括指定で消えるので !important） */
.s{position:absolute;will-change:transform,opacity,filter}
.jp{font-family:var(--JP)}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 72% 70% at 50% 48%,transparent 50%,rgba(0,0,0,.6))}
.k{font:800 22px var(--EN);letter-spacing:.5em;color:var(--y);white-space:nowrap}
.card{border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55);background:#fff}
.card img{display:block;width:100%}
.photo{border-radius:10px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
</style></head>
<body><div id="back" style="position:absolute;inset:0"></div><div id="frame" style="position:absolute;inset:0"></div><div id="cam"></div><div id="bars" style="position:absolute;inset:0;pointer-events:none"></div><div class="vig"></div><div class="grain" id="grain"></div>
<script>
const cam = document.getElementById('cam');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const oc = x => 1 - Math.pow(1 - x, 3), o5 = x => 1 - Math.pow(1 - x, 5), ioc = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const U = p => !p ? '' : (/^(https?:|data:|\/)/.test(p) ? p : '/proj/' + p.split('/').map(encodeURIComponent).join('/'));
const IMGD = {};   // 画像の縦横（読み込み時に控える）
const X0 = 240, Y0 = 170;   // 場面の文字の左端と上端（会場で端が切れても残る中央 80% の内側・黒帯の内側）
let THEME = {};
function el(html, x, y, extra) { const d = document.createElement('div'); d.className = 's'; d.innerHTML = html; d.style.left = x + 'px'; d.style.top = y + 'px'; if (extra) d.style.cssText += extra; cam.appendChild(d); return d; }
// 立ち上がり：ぼけから定まり、少し下から上がる。t1 から短く消える
function rise(d, t, t0, dur, dy, t1, center) {
  dur = dur || .6; dy = dy == null ? 26 : dy;
  const p = o5(P(t, t0, t0 + dur)); let op = t < t0 ? 0 : p;
  if (t1 != null && t > t1) op *= 1 - oc(P(t, t1, t1 + .35));
  d.style.opacity = op; d.style.filter = `blur(${(1 - p) * 10}px)`;
  d.style.transform = `${center ? 'translate(-50%,-50%) ' : ''}translateY(${(1 - p) * dy}px)`;
}
function bg(src, t, dur, op, blur) {   // ゆっくり寄る背景写真
  if (!src) return;
  const d = el(`<img src="${U(src)}" style="display:block;width:1920px;height:1080px;object-fit:cover">`, 0, 0);   // <img> にする（撮る前に読み込みを待てる。CSS の背景だと最初の 1 コマが無地になった）
  d.style.opacity = op; d.style.filter = `blur(${blur}px) saturate(.85)`; d.style.transform = `scale(${1.08 + .06 * P(t, 0, dur)})`;
}
function bounce(p) { return p >= 1 ? 1 : 1 - Math.cos(p * Math.PI * 2.4) * Math.pow(1 - p, 2.2); }
function brandBg(t) {   // ブランド色の地＋網点（ゆっくり流れる）
  el(`<div style="width:1920px;height:1080px;background:var(--brand)"></div>`, 0, 0);
  const d = el(`<div style="width:2200px;height:1300px;opacity:.16;background-image:radial-gradient(circle,var(--dot) 22%,transparent 24%);background-size:26px 26px"></div>`, -140, -110);
  d.style.transform = `translate(${-t * 14}px,${-t * 8}px)`;
}
function logoImg(src, t, t0, cx, cy, w) {   // ロゴの画像。跳ねて定まる
  const p = P(t, t0, t0 + .7), s = .55 + .45 * bounce(p);
  const d = el(`<img src="${U(src)}" style="width:${w}px;filter:drop-shadow(10px 12px 0 rgba(0,0,0,.18))">`, cx, cy);
  d.style.opacity = t < t0 ? 0 : Math.min(1, p * 4); d.style.transform = `translate(-50%,-50%) scale(${s}) rotate(${(1 - o5(p)) * -6}deg)`;
}
function catchLine(parts, t, t0, cx, cy, size) {   // キャッチ：語ごとのグラデーション＋白の縁＋黒の外縁（Dela Gothic One）
  if (!parts || !parts.length) return;
  const layer = st => parts.map(([w, a, b]) => `<span style="${st(a, b)}">${w}</span>`).join('');
  const base = `font:400 ${size}px DG,var(--JP);letter-spacing:.07em;white-space:nowrap;position:absolute;left:0;top:0`;
  const chars = parts.reduce((n, p) => n + [...p[0]].length, 0), w = size * chars * 1.08;
  const html = `<div style="position:relative;height:${size * 1.25}px;width:${w}px">
    <div style="${base};color:#111;-webkit-text-stroke:${size * .17}px #111">${layer(() => '')}</div>
    <div style="${base};color:#fff;-webkit-text-stroke:${size * .09}px #fff">${layer(() => '')}</div>
    <div style="${base}">${layer((a, b) => `background:linear-gradient(180deg,${a},${b || a});-webkit-background-clip:text;background-clip:text;color:transparent`)}</div></div>`;
  const d = el(html, cx - w / 2, cy); const p = P(t, t0, t0 + .55);
  d.style.opacity = t < t0 ? 0 : Math.min(1, p * 3); d.style.transform = `scale(${.8 + .2 * bounce(p)}) rotate(${-2 + 2 * o5(p)}deg)`; d.style.transformOrigin = '50% 50%';
}
function back(c) {   // 止まった地：質感の紙・石目（pv.py texture で作る）やぼかした写真。場面が替わっても同じ指定なら描き直さない
  const b = document.getElementById('back'), key = c.back ? JSON.stringify(c.back) : '';
  if (b.dataset.k === key) return; b.dataset.k = key;
  if (!c.back) { b.innerHTML = ''; return; }
  const o = typeof c.back === 'string' ? { img: c.back } : c.back;
  b.innerHTML = `<img src="${U(o.img)}" style="position:absolute;left:${o.blur ? -60 : 0}px;top:${o.blur ? -60 : 0}px;width:${1920 + (o.blur ? 120 : 0)}px;height:${1080 + (o.blur ? 120 : 0)}px;object-fit:cover;filter:blur(${o.blur || 0}px) saturate(${o.sat == null ? 1 : o.sat});opacity:${o.op == null ? 1 : o.op}">`
    + (o.tint ? `<div style="position:absolute;inset:0;background:${o.tint}"></div>` : '');
}
const clear = () => { cam.innerHTML = ''; cam.style.transform = ''; cam.style.opacity = 1; cam.style.transformOrigin = '50% 50%'; };
const fadeOut = (t, dur, len) => { cam.style.opacity = 1 - P(t, dur - (len || .35), dur); };
const S = {};

// ===== title：暗い地に見出し（ロゴの画像か文字） =====
S.title = function (t, dur, c) {
  clear(); bg(c.bg, t, dur, .16 * P(t, 0, 1), 18);
  cam.style.transform = `scale(${1.02 - .02 * P(t, 0, dur)})`;
  const ln = el(`<div style="width:${300 * o5(P(t, .1, .8))}px;height:2px;background:var(--y)"></div>`, 960 - 150 * o5(P(t, .1, .8)), 330);
  if (c.kicker) { const k = el(`<div class="k" style="font-size:24px">${c.kicker}</div>`, 960, 380); rise(k, t, .3, .6, 12, null, true); }
  if (c.logo) logoImg(c.logo, t, .4, 960, 540, c.logo_w || 1000);
  else { const h = el(`<div style="font:900 ${c.size || 150}px var(--EN),var(--JP);color:var(--fg);letter-spacing:.04em;white-space:nowrap">${c.text || ''}</div>`, 960, 540); rise(h, t, .45, .7, 30, null, true); }
  if (c.sub) { const s = el(`<div class="jp" style="font-weight:600;font-size:44px;color:var(--fg);letter-spacing:.18em;white-space:nowrap">${c.sub}</div>`, 960, 720); rise(s, t, 1.1, .7, 16, null, true); }
  fadeOut(t, dur, .3);
};
// ===== brand：ブランド色の地にロゴの画像とキャッチ（題字） =====
S.brand = function (t, dur, c) {
  clear(); brandBg(t);
  if (c.kicker) { const k = el(`<div style="font:800 26px var(--EN);letter-spacing:.5em;color:#111;white-space:nowrap">${c.kicker}</div>`, 960, 300); rise(k, t, .35, .5, 12, null, true); }
  if (c.logo) logoImg(c.logo, t, .05, 960, 500, c.logo_w || 1180);
  catchLine(c.catch, t, .8, 960, 690, c.catch_size || 74);
  cam.style.transform = `scale(${1 + .03 * P(t, 0, dur)})`;
  fadeOut(t, dur, .3);
};
// ===== brand_end：終わりの画面（アイコン・ロゴ・キャッチ・リンク） =====
S.brand_end = function (t, dur, c) {
  clear(); brandBg(t);
  const cx = c.icon ? 1130 : 960;
  if (c.icon) {
    const ic = el(`<img src="${U(c.icon)}" style="width:300px;border-radius:26px;border:6px solid #111;box-shadow:12px 14px 0 rgba(0,0,0,.2)">`, 330, 470);
    const pi = P(t, .1, .8); ic.style.opacity = Math.min(1, pi * 4); ic.style.transform = `translate(-50%,-50%) scale(${.5 + .5 * bounce(pi)}) rotate(${-6 + 2 * o5(pi)}deg)`;
  }
  if (c.logo) logoImg(c.logo, t, .3, cx, 400, c.logo_w || 1150);
  catchLine(c.catch, t, 1.0, cx, 560, c.catch_size || 70);
  const pill = (a, b) => `<span style="display:inline-flex;align-items:center;gap:14px;background:#111;color:#fff;border-radius:999px;padding:14px 30px"><span style="font:800 24px var(--EN);color:var(--brand);letter-spacing:.06em">${a}</span><span class="jp" style="font-weight:800;font-size:28px;letter-spacing:.06em">${b}</span></span>`;
  if (c.links) { const h = el(`<div style="display:flex;gap:26px;white-space:nowrap">${c.links.map(l => pill(l[0], l[1])).join('')}</div>`, cx, 800); rise(h, t, 1.6, .5, 14, null, true); }
  cam.style.opacity = 1 - P(t, dur - 1.0, dur);
};
// ===== stat：大きな数字（数え上がる）＋一言＋添える画像 =====
S.stat = function (t, dur, c) {
  clear(); bg(c.bg, t, dur, .28, 14);
  const k = el(`<div class="k">${c.kicker || ''}</div>`, X0, 300); rise(k, t, .1, .6, 16);
  const n = Math.round((c.value || 0) * o5(P(t, .3, 1.7)));
  const b = el(`<div style="white-space:nowrap"><span style="font:var(--WS) 300px/1 var(--EN);color:var(--fg);letter-spacing:-.02em">${n.toLocaleString()}</span><span class="jp" style="font-weight:var(--WS);font-size:110px;color:var(--fg);margin-left:22px">${c.unit || ''}</span></div>`, X0 - 10, 350);
  rise(b, t, .25, .6, 30);
  el(`<div style="width:${520 * o5(P(t, 1.5, 2.1))}px;height:6px;background:var(--y)"></div>`, X0, 700);
  if (c.sub) { const s = el(`<div class="jp" style="font-weight:600;font-size:40px;color:var(--fg);letter-spacing:.08em;white-space:nowrap">${c.sub.replace(/<b>/g, '<span style="color:var(--y)">').replace(/<\/b>/g, '</span>')}</div>`, X0, 740); rise(s, t, 1.55, .6, 16); }
  if (c.card) { const x = el(`<div class="card" style="width:480px"><img src="${U(c.card)}"></div>`, 1200, 200);
    const q = o5(P(t, 1.0, 1.7)); x.style.opacity = q; x.style.transform = `translate(${(1 - q) * 160}px,0) rotate(2.5deg)`; x.style.filter = `blur(${(1 - q) * 8}px)`; }
  fadeOut(t, dur);
};
// ===== map：地図に点と写真のカード（build/map.json は pv.py map で作る） =====
S.map = function (t, dur, c) {
  clear(); const J = MAP; if (!J) return;
  const sc = c.scale || .92, fq = c.focus && J.places[c.focus];   // focus: 地点の名前を (cx, cy) に置く（近い地点どうしを大きく見せる）
  const ox = fq ? (c.cx || 960) - fq[0] * sc : (c.cx || 760) - J.w * sc / 2, oy = fq ? (c.cy || 540) - fq[1] * sc : 540 - J.h * sc / 2;
  cam.style.transformOrigin = '880px 520px'; cam.style.transform = `scale(${1.04 + .05 * ioc(P(t, 0, dur))})`;
  const m = el(`<svg width="${J.w * sc}" height="${J.h * sc}" viewBox="0 0 ${J.w} ${J.h}" style="overflow:visible"><path d="${J.paths.join(' ')}" fill="var(--land)" stroke="var(--line)" stroke-width="1.2" stroke-linejoin="round"/></svg>`, ox, oy);
  m.style.opacity = oc(P(t, 0, .6));
  if (c.kicker) { const k = el(`<div class="k">${c.kicker}</div>`, X0, Y0); rise(k, t, .2, .6, 14); }
  if (c.title) { const h = el(`<div class="jp" style="font-weight:var(--WS);font-size:64px;color:var(--fg);letter-spacing:.06em;white-space:nowrap">${c.title}</div>`, X0, Y0 + 36); rise(h, t, .3, .6, 18); }
  const items = (c.places || []).map(pl => { const q = J.places[pl.name] || [0, 0]; return [pl, ox + q[0] * sc + (pl.dx || 0), oy + q[1] * sc + (pl.dy || 0)]; });
  const lines = [];
  items.forEach(([pl, x, y]) => { if (t > pl.at + .1) { const q = o5(P(t, pl.at + .1, pl.at + .45)); const [cx, cy] = pl.card;
    lines.push(`<line x1="${x}" y1="${y}" x2="${x + (cx - x) * q}" y2="${y + (cy - y) * q}" stroke="var(--y)" stroke-opacity=".75" stroke-width="2"/>`); } });
  el(`<svg width="1920" height="1080" style="overflow:visible">${lines.join('')}</svg>`, 0, 0);
  items.forEach(([pl, x, y]) => {
    const p = P(t, pl.at, pl.at + .5), pulse = ((t - pl.at) % 1.4 + 1.4) % 1.4 / 1.4;
    const dot = el(`<div style="position:relative;width:0;height:0"><div style="position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--y);box-shadow:0 0 22px var(--y)"></div>
      <div style="position:absolute;left:${-9 - 26 * pulse}px;top:${-9 - 26 * pulse}px;width:${18 + 52 * pulse}px;height:${18 + 52 * pulse}px;border-radius:50%;border:2px solid var(--y);opacity:${.7 * (1 - pulse)}"></div></div>`, x, y);
    dot.style.opacity = t < pl.at ? 0 : 1; dot.style.transform = `scale(${o5(p)})`;
    const [cx, cy] = pl.card;
    const card = el(`${pl.img ? `<div class="photo" style="width:300px;height:190px"><img src="${U(pl.img)}"></div>` : ''}
      <div style="margin-top:14px;font:800 15px var(--EN);letter-spacing:.32em;color:var(--y)">${pl.en || ''}</div>
      <div style="margin-top:6px;display:flex;align-items:baseline;gap:16px"><span class="jp" style="font-weight:800;font-size:34px;color:var(--fg);letter-spacing:.06em">${pl.label || pl.name}</span><span style="font:800 18px var(--EN);color:var(--fg2);letter-spacing:.2em">${pl.sub || ''}</span></div>`, cx - 150, cy - 95);
    rise(card, t, pl.at + .25, .6, 22);
  });
  fadeOut(t, dur);
};
// ===== list：項目の名前が下から積み上がる＋右にサムネが重なる =====
S.list = function (t, dur, c) {
  clear();
  if (c.kicker) { const k = el(`<div class="k">${c.kicker}</div>`, 140, 150); rise(k, t, .05, .6, 14); }
  let tt = .25, gap = .55; const shown = [];
  (c.items || []).forEach((s, i) => { shown.push([s, i, tt]); tt += gap; gap = Math.max(.32, gap * .9); });
  const vis = shown.filter(s => s[2] <= t);
  vis.forEach(([s, i, t0], j) => {
    const fromEnd = vis.slice(j + 1).reduce((a, q) => a + o5(P(t, q[2], q[2] + .4)), 0);   // 後から来た数をなめらかに数える（行が飛ばない）
    const y = 820 - fromEnd * 92 + (1 - o5(P(t, t0, t0 + .45))) * 60;
    if (y < 190) return;
    const fs = 58 + 18 * Math.max(0, 1 - fromEnd);
    const d = el(`<div style="display:flex;align-items:baseline;gap:26px;white-space:nowrap"><span style="font:800 22px var(--EN);color:var(--y);letter-spacing:.1em">${String(i + 1).padStart(2, '0')}</span><span class="jp" style="font-weight:800;font-size:${fs.toFixed(1)}px;color:var(--fg);letter-spacing:.05em">${s}</span></div>`, 140, y);
    d.style.opacity = (t < t0 ? 0 : o5(P(t, t0, t0 + .35))) * Math.max(.18, 1 - fromEnd * .17) * (y < 260 ? (y - 190) / 70 : 1); d.style.filter = `blur(${(1 - o5(P(t, t0, t0 + .35))) * 8}px)`;
  });
  const TH = c.thumbs || [];
  TH.forEach((src, i) => { const t0 = .2 + i * 1.15; if (t < t0) return;
    const d = el(`<div class="card" style="width:620px"><img src="${U(src)}"></div>`, 1170 + (i % 2) * 36, 230 + i * 40);
    const q = o5(P(t, t0, t0 + .6)); d.style.opacity = q; d.style.transform = `translateX(${(1 - q) * 120}px) rotate(${(i % 2 ? 1.5 : -1.5)}deg)`; d.style.filter = `blur(${(1 - q) * 6}px) brightness(${1 - .1 * (TH.length - 1 - i)})`; });
  if (c.more) { const e = el(`<div class="jp" style="font-weight:600;font-size:34px;color:var(--fg2);letter-spacing:.2em;white-space:nowrap">${c.more}</div>`, 140, 930); rise(e, t, tt + .1, .5, 12); }
  fadeOut(t, dur);
};
// ===== wall：画像（バナー・サムネ）が 3 段で横に流れる =====
S.wall = function (t, dur, c) {
  clear(); bg(c.bg, t, dur, .10, 26);
  if (c.kicker) { const k = el(`<div class="k">${c.kicker}</div>`, X0, Y0); rise(k, t, .1, .6, 14); }
  if (c.title) { const h = el(`<div class="jp" style="font-weight:var(--WS);font-size:56px;color:var(--fg);letter-spacing:.06em;white-space:nowrap">${c.title}</div>`, X0, Y0 + 30); rise(h, t, .2, .6, 18); }
  const strip = el('', 192, 0, 'width:1536px;height:1080px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)');
  const rows = [385, 600, 815], W = 320, H = W * 9 / 16, G = 26;
  (c.images || []).forEach((e, i) => {

  const L = { 1: [[0, 0, 680, 680]], 2: [[0, 20, 440, 520], [300, 260, 380, 440]], 3: [[0, 0, 680, 400], [0, 430, 330, 250], [350, 430, 330, 250]],
              4: [[0, 0, 330, 330], [350, 0, 330, 330], [0, 350, 330, 330], [350, 350, 330, 330]] }[n] || [];
  const oy = 540 - 340, tilt = c.tilt == null ? [-1.2, 1.6, -.6, 1.0] : c.tilt;
  L.forEach((b, i) => {
    const t0 = .1 + i * .22, p = o5(P(t, t0, t0 + .8)), mono = c.mono ? 1 - ioc(P(t, t0 + .3, t0 + 1.8)) : 0;
    const d = el(`<div style="width:${b[2]}px;height:${b[3]}px;padding:${c.mat == null ? 12 : c.mat}px;background:var(--mat);box-shadow:0 22px 50px rgba(60,40,20,.22);box-sizing:border-box">
      <div style="width:100%;height:100%;overflow:hidden"><img src="${U(imgs[i])}" style="width:100%;height:100%;object-fit:cover;object-position:${(c.focus || [])[i] || '50% 40%'};display:block;filter:grayscale(${mono});transform:scale(${1.03 + .04 * P(t, 0, dur)});transform-origin:${(c.focus || [])[i] || '50% 40%'}"></div></div>`, ox + b[0], oy + b[1]);
    d.style.opacity = p; d.style.filter = `blur(${(1 - p) * 6}px)`; d.style.transform = `translateY(${(1 - p) * 24}px) rotate(${tilt[i % tilt.length] * (n > 1 ? 1 : .6)}deg)`;
  });
  const tx = side === 'left' ? 1010 : 230;
  const col = el('', tx, 540, 'width:680px;display:flex;flex-direction:column;align-items:flex-start;gap:10px'); col.style.transform = 'translateY(-50%)';
  const add = (hh, t0, dy) => { const q = document.createElement('div'); q.innerHTML = hh; const d = q.firstElementChild; col.appendChild(d); appear(d, t, t0, .7, dy); };
  if (c.head) add(`<div class="k" style="font-size:${c.head_size || 22}px;margin-bottom:4px">${c.head}</div>`, .25, 10);
  if (c.sub) add(`<div style="font-family:var(--JP);font-weight:600;font-size:${c.sub_size || 34}px;color:var(--fg);letter-spacing:.12em">${c.sub}</div>`, .4, 12);
  if (c.note) add(`<div style="font-family:var(--JP);font-weight:400;font-size:${c.note_size || 28}px;color:var(--fg2);letter-spacing:.1em;margin-bottom:18px;white-space:nowrap">${c.note}</div>`, .55, 12);
  const roles = (c.names || []).map(nm => nm.includes('　') ? nm.split('　')[0] : ''), rw = Math.max(0, ...roles.map(r => r.length));   // 役職の列をそろえる（「設計部 課長　長谷川」と「設計部　森本」の頭）
  (c.names || []).forEach((nm, i) => {
    const body = rw ? `<span style="display:inline-block;min-width:${(rw * 1.14 + .8).toFixed(2)}em">${roles[i]}</span>${roles[i] ? nm.slice(roles[i].length + 1) : nm}` : nm;
    add(`<div style="font-family:var(--JP);font-weight:600;font-size:${c.name_size || 40}px;color:var(--fg);letter-spacing:.14em;line-height:1.5;white-space:nowrap">${body}</div>`, .75 + i * .12, 14);
  });
  fadeOut(t, dur, c.out == null ? .5 : c.out);
};
// ===== stack：写真が 1 枚ずつ机に置かれるように重なっていく（山場の前の振り返り）。lines で見出しを左上に =====
// imgs, every: 1 枚の間隔（秒）, seed, push: 全体の寄り（負で引く）, spots: 置き場所, label_at: 見出しの左上, dark_out: 終わりの秒で暗く（山場の暗転へ）
S.stack = function (t, dur, c) {
  clear(); let s = c.seed || 3; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const ev = c.every || .45;
  (c.imgs || []).forEach((im, i) => {
    const r4 = [520 + rnd() * 1000, 380 + rnd() * 440, 380 + rnd() * 170, (rnd() - .5) * 22];
    const [x, y, w, rot] = c.spots && c.spots[i] ? c.spots[i] : r4, t0 = (c.start || .2) + i * ev;   // spots: [[x, y, 幅, 傾き], …] 顔を隠さない置き場所
    if (t < t0) return;
    const p = o5(P(t, t0, t0 + .75)), [iw, ih] = IMGD[im] || [4, 3], h = w * ih / iw;
    const d = el(`<div style="width:${w}px;height:${h}px;padding:12px;background:var(--mat);box-shadow:0 18px 44px rgba(40,25,10,.3)"><img src="${U(im)}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`, x, y);
    d.style.opacity = p; d.style.filter = `blur(${(1 - p) * 6}px)`; d.style.transform = `translate(-50%,-50%) scale(${1.55 - .55 * p}) rotate(${rot * (1 + (1 - p) * 1.4)}deg)`;
  });
  if (c.lines) {                                         // 見出しは写真の手前の白いラベルに（重なった写真に隠れない）
    const [lx, ly] = c.label_at || [X0, Y0 + 10];               // label_at: 見出しの左上（写真の顔を避けて隅へ）
    const box = el('', lx, ly, 'width:max-content;display:flex;flex-direction:column;gap:6px;z-index:5;padding:26px 40px 30px;background:var(--mat);box-shadow:0 16px 40px rgba(40,25,10,.22);transform:rotate(-1.5deg)');
    appear(box, t, .15, .8, 12); stack(box, c.lines, t, .35, .3, 'var(--fg)', '');
  }
  cam.style.transform = `scale(${1 + (c.push == null ? .06 : c.push) * P(t, 0, dur)})`;
  if (c.dark_out) el(`<div style="width:2600px;height:1600px;background:${c.dark || '#0d0b09'}"></div>`, -340, -260, 'z-index:9').style.opacity = ioc(P(t, dur - c.dark_out, dur));   // 山場の前に暗く
  else fadeOut(t, dur, c.out == null ? .6 : c.out);
};
// ===== credits：エンドロール。名前が窓の下から流れ、最後に締めの言葉が止まる =====
// sections: [{head: 英字の見出し, sub: 日本語の見出し, note: 1 行の言葉, names: [...]}]  col: [左端, 幅]  win_y / win_h: 文字の窓
// lead: 流れ始める秒  last: {lines: card と同じ並び, at: 出る秒}  tail: 名前の最後に流す 1 行（例 and all guests）  name_size  align
S.credits = function (t, dur, c) {
  clear();
  const [cx, cw] = c.col || [1100, 640], wy = c.win_y || 150, wh = c.win_h || 780, lead = c.lead == null ? .6 : c.lead;
  const lastAt = c.last ? (c.last.at == null ? dur - 8 : c.last.at) : dur;
  const html = (c.sections || []).map(s => `<div style="margin-bottom:${c.sec_gap || 100}px">
      ${s.head ? `<div style="font:500 22px var(--ENS);letter-spacing:.32em;color:var(--y);text-transform:uppercase">${s.head}</div>` : ''}
      ${s.sub ? `<div style="font-family:var(--JP);font-weight:600;font-size:30px;color:var(--fg2);letter-spacing:.14em;margin-top:8px">${s.sub}</div>` : ''}
      ${s.note ? `<div style="font-family:var(--JP);font-weight:400;font-size:${c.note_size || 28}px;color:var(--fg);opacity:.8;letter-spacing:.08em;margin-top:10px;line-height:1.6">${s.note}</div>` : ''}
      <div style="margin-top:22px;font-family:var(--JP);font-weight:${c.name_w || 600};font-size:${c.name_size || 40}px;line-height:1.9;color:var(--fg);letter-spacing:.14em">${(s.names || []).map(n => `<div style="white-space:nowrap">${n}</div>`).join('')}</div></div>`).join('')
    + (c.tail ? `<div style="margin-top:40px;display:flex;flex-direction:column;gap:14px">${(typeof c.tail[0] === 'string' && !Array.isArray(c.tail[0]) ? [c.tail] : c.tail).map(l => lineHtml(l, 'var(--fg)', '')[0]).join('')}</div>` : '');
  const win = el('', cx, wy, `width:${cw}px;height:${wh}px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%)`);
  const roll = document.createElement('div'); roll.style.cssText = `position:absolute;left:0;top:0;width:${cw}px;text-align:${c.align || 'left'}`; roll.innerHTML = html; win.appendChild(roll);
  const H = roll.offsetHeight;
  roll.style.transform = `translateY(${wh - (wh + H) * P(t, lead, lastAt - .2)}px)`;
  if (c.last) {
    const bx = el('', cx, wy + wh / 2, `width:${cw}px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center`);
    bx.style.transform = 'translateY(-50%)';
    stack(bx, c.last.lines, t, lastAt + .2, c.last.step || .4, 'var(--fg)', '');
  }
  fadeOut(t, dur, c.out == null ? .8 : c.out);
};
// ===== countdown：10→1（1 秒ずつ）。円が 1 秒で一周し、数字が切り替わる =====
// from（10）, step（1）, lead（始まるまでの秒）, dim（下を暗く）, dim_box（暗くする四角。省くと全面）, center（円の中心）, leader（十字の線）, text（下の一言）, fg, ring（線の色）
S.countdown = function (t, dur, c) {
  clear();
  if (c.dim) { const [dx, dy, dw, dh] = c.dim_box || [0, 0, 1920, 1080];
    const d = el(`<div style="width:${dw}px;height:${dh}px;background:var(--shade)"></div>`, dx, dy); d.style.opacity = c.dim * o5(P(t, 0, .4)); }
  const from = c.from || 10, step = c.step || 1, lead = c.lead || 0, k = Math.floor((t - lead) / step), n = from - k, u = (((t - lead) % step) + step) % step / step;
  const [X, Y] = c.center || [960, 540], R = c.r || 220, ln = c.ring || 'var(--line)';
  if (c.text) { const tx = el(`<div class="jp" style="font-weight:600;font-size:34px;color:${c.fg || 'var(--fg2)'};letter-spacing:.2em;white-space:nowrap">${c.text}</div>`, X, Y + R + 100); rise(tx, t, .2, .6, 10, null, true); }
  if (t >= lead && n >= 1) {
    const arc = 2 * Math.PI * R, L = c.leader === false ? '' :
      `<line x1="${X - R - 140}" y1="${Y}" x2="${X + R + 140}" y2="${Y}" stroke="${ln}" stroke-width="1"/><line x1="${X}" y1="${Y - R - 140}" x2="${X}" y2="${Y + R + 140}" stroke="${ln}" stroke-width="1"/>`;
    if (!c.no_ring) el(`<svg width="1920" height="1080" style="overflow:visible">${L}<circle cx="${X}" cy="${Y}" r="${R}" fill="none" stroke="${ln}" stroke-width="1.5"/>
      <circle cx="${X}" cy="${Y}" r="${R}" fill="none" stroke="var(--y)" stroke-width="3" stroke-dasharray="${arc}" stroke-dashoffset="${arc * (1 - u)}" transform="rotate(-90 ${X} ${Y})"/></svg>`, 0, 0);   // no_ring: 丸い枠なしで数字だけ（枠はテンプレートに見えやすい）
    const q = o5(P(u, 0, .22));
    const num = el(`<div style="font:500 ${c.size || 280}px/1 var(--ENS);color:${c.fg || 'var(--fg)'}">${n}</div>`, X, Y);
    num.style.transform = `translate(-50%,-54%) scale(${1.1 - .1 * q})`; num.style.opacity = Math.min(1, q * 1.3) * (1 - .55 * P(u, .86, 1));
  }
  fadeOut(t, dur, .4);
};
// 映像の窓・額（scenes.json の hole: [x, y, 幅, 高さ]）。窓の外を地の色で塗り、窓の中は透明（overlay で下の映像が見える）
// hole_border: 額の縁の太さ（hole_color） hole_in / hole_out: 始まり／終わりの何秒で、額が地から溶けて現れる／地へ溶けて閉じる（地の色が窓をふさぐ）
function frame(c, t, dur) {
  const fr = document.getElementById('frame'); fr.innerHTML = '';
  const bk = document.getElementById('back'); bk.style.clipPath = '';
  if (!c.hole) return;
  const [hx, hy, hw, hh] = c.hole, b = c.hole_border || 0, r = c.hole_radius || 0;
  if (c.back) {                                          // 止まった地（紙・石目）に窓をあけ、下の映像をプリントのように見せる（"overlay": true と一緒に）
    bk.style.clipPath = `polygon(evenodd,0 0,1920px 0,1920px 1080px,0 1080px,0 0,${hx}px ${hy}px,${hx}px ${hy + hh}px,${hx + hw}px ${hy + hh}px,${hx + hw}px ${hy}px,${hx}px ${hy}px)`;
    const sh = THEME.light ? 'rgba(60,40,20,.2)' : 'rgba(0,0,0,.5)';
    fr.innerHTML = `<div style="position:absolute;left:${hx}px;top:${hy}px;width:${hw}px;height:${hh}px;box-shadow:0 0 0 ${b}px ${c.hole_color || 'var(--mat)'},0 26px 60px ${b}px ${sh}"></div>`;
    return;
  }
  const sh = THEME.light ? 'rgba(60,40,20,.16)' : 'rgba(0,0,0,.5)';
  const open = (c.hole_in ? ioc(P(t, 0, c.hole_in)) : 1) * (c.hole_out ? 1 - ioc(P(t, dur - c.hole_out, dur)) : 1);
  const box = `position:absolute;left:${hx}px;top:${hy}px;width:${hw}px;height:${hh}px;border-radius:${r}px`;
  fr.innerHTML = `<div style="${box};box-shadow:0 0 0 4000px var(--bg)"></div>
    <div style="${box};box-shadow:0 0 0 ${b}px ${c.hole_color || 'var(--mat)'},0 24px 60px ${b}px ${sh};opacity:${open}"></div>
    <div style="${box};background:var(--bg);opacity:${1 - open}"></div>`;
}

let CFG = {}, MAP = null, LETTERBOX = true; window.DUR = {};
window.renderFx = function (k, t) {
  const c = (CFG.scenes || {})[k] || {}, type = c.type || k;
  if (!S[type]) throw new Error('場面の種類が無い: ' + type);
  back(c);
  S[type](t, window.DUR[k], c);
  frame(c, t, window.DUR[k]);
  const ov = !!c.overlay;
  document.getElementById('bars').innerHTML = LETTERBOX && !ov && type !== 'brand' && type !== 'brand_end' && !c.no_bars
    ? '<div style="position:absolute;left:0;top:0;width:1920px;height:138px;background:#000"></div><div style="position:absolute;left:0;top:941px;width:1920px;height:139px;background:#000"></div>' : '';                                    // 透明の場面：地と周辺の暗さと粒を消す
  document.documentElement.style.background = document.body.style.background = ov ? 'transparent' : '';
  // 透明の場面が画面いっぱい不透明になると、撮った PNG から透明の情報が消えて書き出しがそこで止まる（文字の抜きを全面に開いた時に 102 コマで切れた）。左上の 1 点だけ常に透明にする
  document.body.style.clipPath = ov ? 'polygon(1px 0,100% 0,100% 100%,0 100%,0 1px,1px 1px)' : '';
  const light = type === 'brand' || type === 'brand_end' || !!THEME.light;   // 明るい地では周辺の暗さと粒を弱める
  document.querySelector('.vig').style.opacity = light || ov ? 0 : 1;
  const g = document.getElementById('grain'); g.style.opacity = ov ? 0 : light ? (THEME.grain == null ? .06 : THEME.grain) : '';
  g.style.backgroundPosition = `${(Math.floor(t * 24) * 37) % 200}px ${(Math.floor(t * 24) * 53) % 200}px`;
};
(async () => {
  CFG = await (await fetch('/proj/build/scenes.json')).json();
  const th = CFG.theme || {}, r = document.documentElement.style; THEME = th;
  for (const [a, b] of [['bg', '--bg'], ['accent', '--y'], ['accent2', '--o'], ['brand', '--brand'], ['dot', '--dot'], ['fg', '--fg'], ['fg2', '--fg2'],
    ['line', '--line'], ['land', '--land'], ['shade', '--shade'], ['mat', '--mat'], ['strong', '--WS']]) if (th[a]) r.setProperty(b, th[a]);
  if (th.font === 'serif') { r.setProperty('--JP', 'var(--SERIF)'); r.setProperty('--EN', 'var(--ENS)'); }
  try { MAP = await (await fetch('/proj/build/map.json')).json(); } catch (e) { MAP = null; }
  try { const st = await (await fetch('/proj/build/style.json')).json(); LETTERBOX = st.letterbox !== false; } catch (e) {}
  const tl = await (await fetch('/proj/build/timeline.json')).json();
  tl.blocks.filter(b => b.t === 'fx').forEach(b => window.DUR[b.k] = b.dur);
  const imgs = new Set();
  JSON.stringify(CFG).replace(/"((?:assets|build|research)\/[^"]+\.(?:png|jpe?g|webp))"/g, (m, p) => imgs.add(p));
  await Promise.all([...imgs].map(p => new Promise(res => { const i = new Image(); i.onload = () => { IMGD[p] = [i.naturalWidth, i.naturalHeight]; res(); }; i.onerror = res; i.src = U(p); })));
  const chars = [...new Set(JSON.stringify(CFG.scenes || {}))].join('') + 'あア亜A1';   // 使う文字の分だけ書体を読み込む
  await Promise.all(['900 100px IN', '800 40px IN', '400 100px DG', '800 40px JPL', '600 40px JPL', '900 40px JPL', '800 40px "Noto Sans JP"',
    '400 40px JPM', '600 40px JPM', '600 40px "Noto Serif JP"', '500 100px "Cormorant Garamond"', '600 100px "Cormorant Garamond"', '400 100px "Pinyon Script"'].map(f => document.fonts.load(f, chars).catch(() => {})));
  window.READY = true;
})();
