<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- 強調テロップ：極太の明朝を縦書きで画面の左右の端に大きく置く。効かせる語は赤×マゼンタのかすれ（pink / red）か黄色の箱（ybox）。
     入りの 0.3 秒は帯状に割れてずれた状態から定まり、消えるときも帯状にずれて消える。背景は透明で書き出して映像に重ねる。
     置き方は案件の build/telops.json（pv.py telops が edl.py の big から作る）。 -->
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&display=block" rel="stylesheet">
<style>
@font-face{font-family:MIN;src:local('Noto Serif JP Black'),local('NotoSerifJP-Black')}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#cam{position:absolute;inset:0}
.col{position:absolute;top:0;writing-mode:vertical-rl;text-orientation:upright;font-family:MIN,'Noto Serif JP','Hiragino Mincho ProN',serif;font-weight:900;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.white{color:#fff;filter:drop-shadow(0 0 26px rgba(0,0,0,.55)) drop-shadow(5px 7px 0 rgba(0,0,0,.35))}
.pink,.red{color:transparent;-webkit-background-clip:text;background-clip:text;background-size:900px auto;filter:drop-shadow(0 0 20px rgba(0,0,0,.5)) drop-shadow(5px 7px 0 rgba(0,0,0,.4))}
.pink{background-image:url(tex/grunge_pink.png)}
.red{background-image:url(tex/grunge_red.png)}
.ybox span{display:inline-block;background:#f5a300;color:#fff;padding:.05em .07em;margin-bottom:.07em}
.ybox{filter:drop-shadow(6px 8px 0 rgba(0,0,0,.35))}
</style></head>
<body><div id="cam"></div>
<script>
const cam = document.getElementById('cam');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const o5 = x => 1 - Math.pow(1 - x, 5), ic = x => x * x * x;
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
let TEL = {};
function column(c, t, dur, seed) {
  const t0 = c.at || 0, tin = .3, tout = .22, t1 = dur - tout;
  if (t < t0) return;
  const pin = P(t, t0, t0 + tin), pout = P(t, t1, dur);
  const html = c.style === 'ybox' ? [...c.text].map(ch => `<span>${ch}</span>`).join('') : c.text;
  const settle = o5(pin), leave = ic(pout);
  const drift = 1 + .035 * P(t, t0, dur);                        // 出ている間はゆっくり大きく
  const dx0 = (c.from === 'R' ? 1 : -1) * 70 * (1 - settle);
  const N = (settle >= 1 && leave <= 0) ? 1 : 7;
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'col ' + c.style; d.style.fontSize = c.size + 'px'; d.style.left = c.x + 'px'; d.style.top = (c.y || 0) + 'px';
    if (c.style === 'pink' || c.style === 'red') d.style.backgroundPosition = `${(seed * 137) % 400}px ${(seed * 91) % 300}px`;
    d.innerHTML = html;
    let off = 0;
    if (N > 1) {
      const a = i / N * 100, b = 100 - (i + 1) / N * 100;
      d.style.clipPath = `inset(${a}% -40% ${b}% -40%)`;
      off = (rnd(seed * 31 + i) - .5) * 2 * (170 * Math.pow(1 - pin, 1.3) + 220 * leave);   // 帯のずれは入りの 0.3 秒いっぱい残す
    }
    d.style.transformOrigin = '50% 40%';
    d.style.transform = `translateX(${dx0 + off}px) scale(${drift * (1.12 - .12 * settle)})`;
    d.style.opacity = Math.min(1, pin * 2.2) * (1 - leave);
    cam.appendChild(d);
    if (settle < 1) { const f = getComputedStyle(d).filter; d.style.filter = (f && f !== 'none' ? f : '') + ` blur(${(1 - settle) * 10}px)`; }
  }
}
window.renderTelop = function (k, t) {
  cam.innerHTML = '';
  const T = TEL[k]; if (!T) return;
  T.cols.forEach((c, i) => column(c, t, T.dur, i + 1 + k.length));
};
(async () => {
  TEL = await (await fetch('/proj/build/telops.json')).json();
  const txt = Object.values(TEL).flatMap(T => T.cols.map(c => c.text)).join('');
  await Promise.all([document.fonts.load('900 100px MIN', txt).catch(() => {}), document.fonts.load('900 100px "Noto Serif JP"', txt).catch(() => {})]);
  await Promise.all(['tex/grunge_pink.png', 'tex/grunge_red.png'].map(s => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = s; })));
  window.READY = true;
})();
</script></body></html>
